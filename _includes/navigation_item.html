{% for item in site.data.toc %}
  <a class="sidebar-nav-item {% if item.docs contains page.url %}active{% endif %}" href="#">{{ item.title }}</a>
  <ul class="sidebar-nav-submenu">
    {% for doc in item.docs %}
      {% assign doc_page = site.pages | find: "url", doc %}
      {% if doc_page %}
        <li>
          <a href="{{ doc_page.url | relative_url }}#content">{{ doc_page.title }}</a>
        </li>
      {% endif %}
    {% endfor %}
  </ul>
{% endfor %}

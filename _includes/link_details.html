{% assign link_to_lookup = include.link %} 
link_to_lookup: {{ link_to_lookup }}
{% for p in site.pages %}
  {% if p.url == link_to_lookup %}
    {% assign page_details = p %}
    {% break %}
  {% endif %}
{% endfor %}

<pre>
{
  "url": {{ include.link  }}
  "pages": {{ page_details | json: 4 }}
}
</pre>
